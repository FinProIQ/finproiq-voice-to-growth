<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinProIQ — Interactive demo</title>
<meta name="description" content="A clickable demo of FinProIQ: booking, CRM updates, voice notes, personalized follow-ups and CRM logging for financial advisors — all 5 steps, live.">
<meta property="og:title" content="FinProIQ — Interactive demo">
<meta property="og:description" content="Try the full flow in 3 minutes: a client books, the CRM updates itself, you record a voice note, approve a personal follow-up, and it all gets logged.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6FA;color:#0E1A3A;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
a{color:#1D5BFF}a:hover{color:#1747D1}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.card{background:#fff;border:1px solid #E2E7F0;border-radius:16px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#5F6980;font-weight:700}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #CBD3E1;background:#fff;color:#0E1A3A;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#F2F5FB}
.btn-pri{background:#1D5BFF;border-color:#1D5BFF;color:#fff}
.btn-pri:hover{background:#1747D1}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid #D5DCE8;background:#fff;font-size:13px;font-weight:700;color:#38445F}
.chip:hover{border-color:#9AA6BD}
.chip-on{background:#0E1A3A;border-color:#0E1A3A;color:#fff}
.chip-on:hover{border-color:#0E1A3A}
.nav{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:none;font-weight:700;font-size:14.5px;color:#4A5675}
.nav:hover{background:#F2F5FB}
.nav-on{background:#EAF0FF;color:#1847D6}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tag-blue{background:#1D5BFF;color:#fff}
.tag-pale{background:#E9F0FF;color:#1A44B8}
.tag-amber{background:#FFEFCC;color:#733A00}
.tag-gray{background:#EEF1F6;color:#4A5675}
.pstep{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:10px;font-size:12.5px;font-weight:700;border:1.5px solid transparent}
.st-done{background:#E9F0FF;color:#1A44B8}
.st-cur{background:#1D5BFF;color:#fff;box-shadow:0 0 0 4px rgba(29,91,255,.18)}
.st-warn{background:#FFF3DC;color:#733A00;border-color:#E9A73B}
.st-pend{background:#F4F6F9;color:#5F6980;border-style:dashed;border-color:#CDD4E0}
.pico{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:11px;font-weight:800}
.st-done .pico{background:#D2DFFF}
.st-cur .pico{background:rgba(255,255,255,.24)}
.st-warn .pico{background:#E9A73B;color:#3D1E00}
.st-pend .pico{background:#E2E6EE}
.ic-cur{background:#1D5BFF;color:#fff}
.ic-done{background:#D2DFFF;color:#1A44B8}
.ic-warn{background:#E9A73B;color:#3D1E00}
.ic-pend{background:#E2E6EE;color:#4A5675}
.plabel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn{width:10px;height:2px;flex:none;background:#D3D9E4}
.conn-on{background:#8FAEFF}
.mwrap{border-top:1px solid #EDF0F5}
.mwrap-open{background:#FAFBFE}
.mrow{width:100%;text-align:left;background:none;border:0;padding:16px 20px;color:inherit;display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.mrow:hover{background:#F8FAFD}
.chev{display:inline-flex;color:#5F6980;transition:transform .2s}
.chev-open{transform:rotate(180deg)}
.act{width:100%;text-align:left;border:0;background:none;padding:14px 20px;display:flex;gap:14px;align-items:flex-start;color:inherit}
.act:hover{background:#F8FAFD}
.aico{width:38px;height:38px;border-radius:12px;background:#EEF3FF;color:#1D5BFF;display:inline-flex;align-items:center;justify-content:center;flex:none}
.aico-warn{background:#FFEFCC;color:#8A4500}
.fld{width:100%;min-height:44px;border:1px solid #C3CCDB;border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;color:#0E1A3A;background:#fff}
.fld:focus{outline:2px solid #1D5BFF;outline-offset:1px;border-color:#1D5BFF}
textarea.fld{min-height:240px;resize:vertical;line-height:1.6}
.lbl{display:block;font-size:12.5px;font-weight:700;color:#38445F;margin-bottom:6px}
.preview{white-space:pre-line;background:#fff;border:1px solid #E2E7F0;border-radius:12px;padding:16px 18px;font-size:14.5px;line-height:1.6;color:#1E2A4A}
.tab{min-height:38px;padding:0 14px;border:0;border-radius:8px;background:none;font-weight:700;font-size:13.5px;color:#4A5675;display:inline-flex;align-items:center;gap:6px}
.tab-on{background:#fff;color:#0E1A3A;box-shadow:0 1px 3px rgba(14,26,58,.14)}
.cli{width:100%;display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid transparent;background:none;text-align:left;color:inherit;min-height:58px}
.cli:hover{background:#F4F6FA}
.cli-on{background:#EEF3FF;border-color:#C6D6FF}
.av{width:38px;height:38px;border-radius:50%;background:#0E1A3A;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.badge{min-width:22px;height:22px;border-radius:999px;background:#E9A73B;color:#3D1E00;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.abox{border:1px solid #E2E7F0;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff;min-width:0}
.abox-cur{border-color:#1D5BFF;box-shadow:0 0 0 3px rgba(29,91,255,.12)}
.abox-warn{border-color:#E9A73B;background:#FFFBF2}
.abox-pend{background:#F8F9FB;border-style:dashed}
.kv{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.kv-amber{color:#9A4A00}
.kv-blue{color:#1D5BFF}
.mic{width:56px;height:56px;border-radius:50%;border:0;background:#1D5BFF;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mic-on{background:#C2410C;animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(194,65,12,.45)}100%{box-shadow:0 0 0 16px rgba(194,65,12,0)}}
.action{border:1.5px solid #E9A73B;background:#FFFBF2;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.sw{width:18px;height:12px;border-radius:4px;display:inline-block}
.st-run{background:#fff;color:#1A44B8;border-color:#1D5BFF;animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(29,91,255,0)}50%{box-shadow:0 0 0 5px rgba(29,91,255,.2)}}
.st-run .pico{background:#E9F0FF}
.ic-run{background:#E9F0FF;color:#1A44B8}
.abox-run{border-color:#1D5BFF}
.pbig{padding:14px;font-size:14px;gap:10px}
.pbig .pico{width:26px;height:26px;font-size:13px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #D2DFFF;border-top-color:#1D5BFF;animation:spin .8s linear infinite;flex:none;display:inline-block}
.spin-sm{width:14px;height:14px;border-radius:50%;border:2px solid #C6D6FF;border-top-color:#1D5BFF;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.fs{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.fs legend{padding:0;margin-bottom:8px}
.live-dot{width:9px;height:9px;border-radius:50%;background:#16A34A;animation:ld 1.6s ease-out infinite;flex:none}
@keyframes ld{0%{box-shadow:0 0 0 0 rgba(22,163,74,.45)}100%{box-shadow:0 0 0 8px rgba(22,163,74,0)}}
@media (max-width:640px){.hide-sm{display:none !important}.act{flex-wrap:wrap}.act-meta{order:3;flex:1 1 100% !important;flex-direction:row !important;align-items:center !important;padding-left:52px}.act-chev{display:none}h1{font-size:30px !important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; background: #F4F6FA">
<header style="background: #ffffff; border-bottom: 1px solid #E2E7F0">
<div style="max-width: 1320px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 34px; height: 34px; border-radius: 10px; background: #0E1A3A; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 19V11"></path><path d="M12 19V5"></path><path d="M19 19v-6"></path></svg></span>
<span style="font-weight: 800; font-size: 18px; letter-spacing: -0.01em">FinProIQ</span>
</div>
<nav aria-label="Main" style="display: flex; gap: 4px">
<button class="{{navDashCls}}" onClick="{{goDash}}">Dashboard</button>
<button class="{{navCliCls}}" onClick="{{goClients}}">Clients</button>
</nav>
<div style="margin-left: auto; display: flex; align-items: center; gap: 12px">
<button class="btn btn-pri" onClick="{{startLive}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Run a live meeting</button>
<span class="tag tag-gray hide-sm">Prototype · sample data</span>
<span class="av" style="width: 36px; height: 36px; background: #1D5BFF">AM</span>
<span class="hide-sm" style="font-size: 14px; font-weight: 700">Alex Morgan</span>
</div>
</div>
</header>

<sc-if value="{{isDash}}" hint-placeholder-val="{{true}}">
<main style="max-width: 1320px; margin: 0 auto; padding: 36px 24px 72px; display: flex; flex-direction: column; gap: 28px">
<section style="display: flex; flex-direction: column; gap: 8px">
<p class="eyebrow mono">{{todayStr}}</p>
<h1 style="margin: 0; font-size: 42px; line-height: 1.1; font-weight: 800; letter-spacing: -0.025em">{{greet}}, Alex.</h1>
<p style="margin: 0; font-size: 17px; color: #4A5675; max-width: 720px; line-height: 1.5">{{greetSub}}</p>
</section>

<section aria-label="Summary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div class="card" style="padding: 20px 22px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13.5px; font-weight: 700; color: #4A5675">{{k.label}}</span>
<p class="{{k.valCls}}">{{k.value}}</p>
<span style="font-size: 13px; color: #5F6980">{{k.sub}}</span>
</div>
</sc-for>
</section>

<section style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div class="card" style="flex: 999 1 620px; min-width: 0; overflow: hidden">
<div style="padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 style="margin: 0; font-size: 20px; font-weight: 800">Recent activity</h2>
<span style="font-size: 13px; color: #5F6980">Everything FinProIQ did for you, newest first</span>
</div>
<div role="group" aria-label="Filter activity" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{actChips}}" as="c" hint-placeholder-count="6">
<button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button>
</sc-for>
<sc-if value="{{hasActClient}}">
<button class="chip chip-on" onClick="{{clearActClient}}" aria-label="Clear client filter">Client: {{actClientName}} ✕</button>
</sc-if>
</div>
</div>
<sc-for list="{{acts}}" as="a" hint-placeholder-count="6">
<div style="border-top: 1px solid #EDF0F5">
<button class="act" onClick="{{a.toggle}}" aria-expanded="{{a.openStr}}">
<span class="{{a.icoCls}}">
<sc-if value="{{a.kBooking}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></sc-if>
<sc-if value="{{a.kNotes}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></sc-if>
<sc-if value="{{a.kFollow}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3.5 6.5l8.5 6 8.5-6"></path></svg></sc-if>
<sc-if value="{{a.kCrm}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="2.5"></ellipse><path d="M5 6v12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6"></path><path d="M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"></path></svg></sc-if>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-weight: 700; font-size: 15px">{{a.title}}</span>
<span style="font-size: 13.5px; color: #4A5675">{{a.who}} · {{a.mtype}}</span>
</span>
<span class="act-meta" style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none">
<span class="mono" style="font-size: 12px; color: #5F6980">{{a.time}}</span>
<sc-if value="{{a.isAttn}}"><span class="tag tag-amber"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.5 20h19L12 3.5z"></path><path d="M12 10v4.5M12 17.5v.3"></path></svg>Needs attention</span></sc-if>
<sc-if value="{{a.isResolved}}"><span class="tag tag-pale">Resolved</span></sc-if>
</span>
<span class="{{a.chevCls}} act-chev" style="margin-top: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
</button>
<sc-if value="{{a.open}}">
<div style="padding: 2px 20px 20px 72px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #1E2A4A">{{a.detail}}</p>
<div style="overflow-x: auto">
<div style="min-width: 560px; display: flex; align-items: center">
<sc-for list="{{a.pipe}}" as="p" hint-placeholder-count="5">
<span style="display: flex; align-items: center; flex: 1; min-width: 0">
<sc-if value="{{p.conn}}"><span class="{{p.connCls}}"></span></sc-if>
<span class="pstep {{p.cls}}" title="{{p.name}}: {{p.stateLabel}}">
<span class="pico">
<sc-if value="{{p.showCheck}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
<sc-if value="{{p.isWarn}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.5 20h19L12 3.5z"></path><path d="M12 10v4.5M12 17.5v.3"></path></svg></sc-if>
<sc-if value="{{p.isPend}}"><span>{{p.n}}</span></sc-if>
</span>
<span class="plabel">{{p.name}}</span>
</span>
</span>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button class="btn btn-pri" onClick="{{a.openTimeline}}">Open in client timeline</button>
<button class="btn" onClick="{{a.filterClient}}">Show only {{a.first}}’s activity</button>
</div>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{noActs}}">
<div style="border-top: 1px solid #EDF0F5; padding: 32px 20px; text-align: center; color: #4A5675; font-size: 14.5px">Nothing here — every item in this view is taken care of.</div>
</sc-if>
</div>

<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<div class="card" style="overflow: hidden">
<div style="padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">Needs your attention</h2>
<sc-if value="{{hasAttn}}"><span class="badge">{{attnCount}}</span></sc-if>
</div>
<sc-for list="{{attn}}" as="t" hint-placeholder-count="3">
<div style="border-top: 1px solid #EDF0F5">
<button class="act" onClick="{{t.open}}">
<span class="aico aico-warn" style="width: 34px; height: 34px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.5 20h19L12 3.5z"></path><path d="M12 10v4.5M12 17.5v.3"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; font-size: 14.5px">{{t.who}}</span>
<span style="font-size: 13.5px; color: #733A00; font-weight: 600">{{t.title}}</span>
<span class="mono" style="font-size: 12px; color: #5F6980">{{t.when}}</span>
</span>
<span style="color: #5F6980; margin-top: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
</button>
</div>
</sc-for>
<sc-if value="{{noAttn}}">
<div style="border-top: 1px solid #EDF0F5; padding: 20px; font-size: 14px; color: #4A5675">All clear. Nothing is stuck.</div>
</sc-if>
</div>

<div class="card" style="overflow: hidden">
<div style="padding: 18px 20px">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">Upcoming meetings</h2>
</div>
<sc-for list="{{upcoming}}" as="u" hint-placeholder-count="3">
<div style="border-top: 1px solid #EDF0F5">
<button class="act" onClick="{{u.open}}">
<span class="aico" style="width: 34px; height: 34px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; font-size: 14.5px">{{u.who}}</span>
<span style="font-size: 13.5px; color: #4A5675">{{u.type}}</span>
<span class="mono" style="font-size: 12px; color: #5F6980">{{u.when}}</span>
</span>
<sc-if value="{{u.hasWarn}}"><span class="tag tag-amber" style="margin-top: 4px">Check</span></sc-if>
</button>
</div>
</sc-for>
</div>
</div>
</section>
</main>
</sc-if>

<sc-if value="{{isClients}}" hint-placeholder-val="{{false}}">
<main style="max-width: 1320px; margin: 0 auto; padding: 28px 24px 72px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<aside class="card" style="flex: 1 1 270px; min-width: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<label for="csearch" class="lbl" style="margin: 0">Filter by client</label>
<input id="csearch" class="fld" type="search" placeholder="Search by name" value="{{search}}" onChange="{{onSearch}}">
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{clientList}}" as="c" hint-placeholder-count="6">
<button class="{{c.cls}}" aria-current="{{c.current}}" onClick="{{c.pick}}">
<span class="av">{{c.initials}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; font-size: 14.5px">{{c.name}}</span>
<span style="font-size: 12.5px; color: #5F6980">{{c.sub}}</span>
</span>
<sc-if value="{{c.hasAttn}}"><span class="badge" aria-label="needs attention">{{c.attn}}</span></sc-if>
</button>
</sc-for>
<sc-if value="{{noClients}}"><p style="margin: 8px 4px; font-size: 13.5px; color: #4A5675">No clients match that search.</p></sc-if>
</div>
</aside>

<section style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div class="card" style="padding: 24px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center">
<span class="av" style="width: 60px; height: 60px; font-size: 19px">{{client.initials}}</span>
<div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">{{client.name}}</h1>
<p style="margin: 0; font-size: 14px; color: #4A5675">{{client.stage}} · {{client.email}} · {{client.phoneText}}</p>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
<div><dt class="eyebrow">Meetings</dt><dd style="margin: 4px 0 0; font-size: 20px; font-weight: 800">{{client.count}}</dd></div>
<div><dt class="eyebrow">Last</dt><dd style="margin: 4px 0 0; font-size: 15px; font-weight: 700; white-space: nowrap">{{client.last}}</dd></div>
<div><dt class="eyebrow">Next</dt><dd style="margin: 4px 0 0; font-size: 15px; font-weight: 700; white-space: nowrap">{{client.next}}</dd></div>
</dl>
<button class="btn btn-pri" onClick="{{startLiveFor}}">Book a new meeting for {{client.first}}</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between">
<div role="group" aria-label="Filter meetings" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{meetChips}}" as="c" hint-placeholder-count="4">
<button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: #4A5675; font-weight: 600">
<span style="display: inline-flex; align-items: center; gap: 6px"><span class="sw" style="background: #1D5BFF"></span>Last completed step</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span class="sw" style="background: #E9F0FF; border: 1px solid #C6D6FF"></span>Done</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span class="sw" style="background: #FFF3DC; border: 1.5px solid #E9A73B"></span>Needs attention</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span class="sw" style="background: #F4F6F9; border: 1.5px dashed #CDD4E0"></span>Not yet</span>
</div>
</div>

<div class="card" style="overflow: hidden">
<div style="padding: 16px 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap">
<h2 style="margin: 0; font-size: 17px; font-weight: 800">Meeting timeline</h2>
<span style="font-size: 13px; color: #5F6980">Click a meeting to see exactly what happened at each step</span>
</div>
<sc-for list="{{meetings}}" as="m" hint-placeholder-count="5">
<div class="{{m.wrapCls}}">
<button class="mrow" onClick="{{m.toggle}}" aria-expanded="{{m.openStr}}">
<span style="width: 200px; flex: none; display: flex; flex-direction: column; gap: 3px">
<span class="mono" style="font-size: 12px; color: #5F6980">{{m.dLong}} · {{m.time}}</span>
<span style="font-weight: 700; font-size: 15.5px">{{m.type}}</span>
</span>
<span style="flex: 999 1 480px; min-width: 0; overflow-x: auto; padding: 4px">
<span style="display: flex; align-items: center; min-width: 500px">
<sc-for list="{{m.pipe}}" as="p" hint-placeholder-count="5">
<span style="display: flex; align-items: center; flex: 1; min-width: 0">
<sc-if value="{{p.conn}}"><span class="{{p.connCls}}"></span></sc-if>
<span class="pstep {{p.cls}}" title="{{p.name}}: {{p.stateLabel}}">
<span class="pico">
<sc-if value="{{p.showCheck}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
<sc-if value="{{p.isWarn}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.5 20h19L12 3.5z"></path><path d="M12 10v4.5M12 17.5v.3"></path></svg></sc-if>
<sc-if value="{{p.isPend}}"><span>{{p.n}}</span></sc-if>
</span>
<span class="plabel">{{p.name}}</span>
</span>
</span>
</sc-for>
</span>
</span>
<span style="display: flex; align-items: center; gap: 10px; flex: none; margin-left: auto">
<span class="{{m.statusCls}}"><sc-if value="{{m.statusWarn}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.5 20h19L12 3.5z"></path><path d="M12 10v4.5M12 17.5v.3"></path></svg></sc-if>{{m.statusText}}</span>
<span class="{{m.chevCls}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
</span>
</button>

<sc-if value="{{m.open}}">
<div style="padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 20px">

<sc-if value="{{m.hasCompose}}">
<div class="action">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<div style="min-width: 0">
<p style="margin: 0; font-weight: 800; font-size: 16.5px">Review follow-up for {{m.first}}</p>
<p style="margin: 4px 0 0; font-size: 13.5px; color: #4A5675">{{m.cp.basis}}</p>
</div>
<div role="tablist" aria-label="Channel" style="display: flex; background: #EEF1F6; padding: 4px; border-radius: 10px; gap: 4px">
<button role="tab" aria-selected="{{m.cp.emailSel}}" class="{{m.cp.emailTabCls}}" onClick="{{m.cp.tabEmail}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3.5 6.5l8.5 6 8.5-6"></path></svg>Email</button>
<button role="tab" aria-selected="{{m.cp.smsSel}}" class="{{m.cp.smsTabCls}}" onClick="{{m.cp.tabSms}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5z"></path></svg>SMS</button>
</div>
</div>

<sc-if value="{{m.cp.isEmail}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<div><label class="lbl" for="to-{{m.id}}">To (email address)</label><input id="to-{{m.id}}" class="fld" type="email" value="{{m.cp.to}}" onChange="{{m.cp.onTo}}"></div>
<div><label class="lbl" for="sub-{{m.id}}">Subject</label><input id="sub-{{m.id}}" class="fld" type="text" value="{{m.cp.subject}}" onChange="{{m.cp.onSubject}}"></div>
</div>
<sc-if value="{{m.cp.editing}}">
<div><label class="lbl" for="body-{{m.id}}">Message</label><textarea id="body-{{m.id}}" class="fld" value="{{m.cp.body}}" onChange="{{m.cp.onBody}}"></textarea></div>
</sc-if>
<sc-if value="{{m.cp.notEditing}}">
<div><span class="lbl">Message preview</span><div class="preview">{{m.cp.body}}</div></div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{m.cp.isSms}}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="max-width: 340px"><label class="lbl" for="ph-{{m.id}}">To (mobile number)</label><input id="ph-{{m.id}}" class="fld" type="tel" placeholder="(555) 555-0100" value="{{m.cp.phone}}" onChange="{{m.cp.onPhone}}"></div>
<sc-if value="{{m.cp.editing}}">
<div><label class="lbl" for="sms-{{m.id}}">Text message</label><textarea id="sms-{{m.id}}" class="fld" style="min-height: 120px" value="{{m.cp.sms}}" onChange="{{m.cp.onSms}}"></textarea></div>
</sc-if>
<sc-if value="{{m.cp.notEditing}}">
<div><span class="lbl">Text preview</span><div class="preview" style="max-width: 460px; background: #EEF3FF; border-color: #C6D6FF; border-radius: 16px 16px 16px 4px">{{m.cp.sms}}</div></div>
</sc-if>
<span class="mono" style="font-size: 12px; color: #5F6980">{{m.cp.smsCount}}</span>
</div>
</sc-if>

<sc-if value="{{m.cp.hasErr}}"><p role="alert" style="margin: 0; color: #B42318; font-size: 14px; font-weight: 600">{{m.cp.err}}</p></sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end">
<button class="btn" onClick="{{m.cp.toggleEdit}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>{{m.cp.editLabel}}</button>
<button class="btn btn-pri" onClick="{{m.cp.send}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L10 14"></path><path d="M21 3l-7 18-4-7-7-4 18-7z"></path></svg>{{m.cp.sendLabel}}</button>
</div>
</div>
</sc-if>

<sc-if value="{{m.hasNotes}}">
<div class="action">
<div>
<p style="margin: 0; font-weight: 800; font-size: 16.5px">Add notes for this meeting</p>
<p style="margin: 4px 0 0; font-size: 13.5px; color: #4A5675; line-height: 1.5">{{m.np.detail}}</p>
</div>
<div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap">
<button class="{{m.np.micCls}}" onClick="{{m.np.toggleMic}}" aria-label="{{m.np.micAria}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></button>
<span style="font-size: 14px; font-weight: 600; color: #1E2A4A; flex: 1 1 240px">{{m.np.micText}}</span>
<button class="btn" onClick="{{m.np.pasteNotes}}">Paste AI notetaker notes</button>
</div>
<div><label class="lbl" for="notes-{{m.id}}">Notes: type, paste from your AI notetaker, or dictate</label><textarea id="notes-{{m.id}}" class="fld" style="min-height: 140px" placeholder="e.g. Reviewed beneficiary forms. Action: send signed form by Friday." value="{{m.np.notes}}" onChange="{{m.np.onNotes}}"></textarea></div>
<sc-if value="{{m.np.hasErr}}"><p role="alert" style="margin: 0; color: #B42318; font-size: 14px; font-weight: 600">{{m.np.err}}</p></sc-if>
<div style="display: flex; justify-content: flex-end"><button class="btn btn-pri" onClick="{{m.np.generate}}">Draft personalized follow-up</button></div>
</div>
</sc-if>

<sc-if value="{{m.hasRetry}}">
<div class="action" style="flex-direction: row; flex-wrap: wrap; align-items: center">
<span class="aico aico-warn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.5 20h19L12 3.5z"></path><path d="M12 10v4.5M12 17.5v.3"></path></svg></span>
<div style="flex: 1 1 320px; min-width: 0">
<p style="margin: 0; font-weight: 800; font-size: 16px">{{m.rp.title}}</p>
<p style="margin: 4px 0 0; font-size: 14px; color: #4A5675; line-height: 1.5">{{m.rp.detail}}</p>
</div>
<button class="btn btn-pri" onClick="{{m.rp.go}}">{{m.rp.action}}</button>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 12px">
<p class="eyebrow">Audit trail</p>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
<sc-for list="{{m.audit}}" as="s" hint-placeholder-count="5">
<li class="{{s.boxCls}}">
<div style="display: flex; align-items: center; gap: 8px">
<span class="{{s.icoCls}}">
<sc-if value="{{s.showCheck}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
<sc-if value="{{s.isWarn}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.5 20h19L12 3.5z"></path><path d="M12 10v4.5M12 17.5v.3"></path></svg></sc-if>
<sc-if value="{{s.isPend}}"><span>{{s.n}}</span></sc-if>
</span>
<span style="font-weight: 800; font-size: 13.5px">{{s.name}}</span>
</div>
<span class="{{s.tagCls}}" style="align-self: flex-start">{{s.stateLabel}}</span>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{s.lines}}" as="l" hint-placeholder-count="2">
<li style="display: flex; flex-direction: column; gap: 2px">
<span class="mono" style="font-size: 11px; color: #5F6980">{{l.t}}</span>
<span style="font-size: 13px; line-height: 1.45; color: #1E2A4A">{{l.x}}</span>
</li>
</sc-for>
</ul>
</li>
</sc-for>
</ol>
</div>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{noMeetings}}">
<div style="border-top: 1px solid #EDF0F5; padding: 32px 20px; text-align: center; color: #4A5675; font-size: 14.5px">No meetings in this view.</div>
</sc-if>
</div>
</section>
</main>
</sc-if>

<sc-if value="{{isLive}}" hint-placeholder-val="{{false}}">
<main style="max-width: 1320px; margin: 0 auto; padding: 28px 24px 72px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between">
<div style="min-width: 0; max-width: 780px">
<p class="eyebrow">Live run · one meeting, all 5 steps</p>
<h1 style="margin: 6px 0 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">{{lv.heading}}</h1>
<p style="margin: 6px 0 0; color: #4A5675; font-size: 15.5px; line-height: 1.5">{{lv.sub}}</p>
</div>
<button class="btn" onClick="{{goDash}}">Exit to dashboard</button>
</div>

<div class="card" style="padding: 16px; overflow-x: auto">
<div style="display: flex; align-items: center; min-width: 720px">
<sc-for list="{{lv.pipe}}" as="p" hint-placeholder-count="5">
<span style="display: flex; align-items: center; flex: 1; min-width: 0">
<sc-if value="{{p.conn}}"><span class="{{p.connCls}}" style="width: 16px"></span></sc-if>
<span class="pstep pbig {{p.cls}}">
<span class="pico">
<sc-if value="{{p.showCheck}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
<sc-if value="{{p.isWarn}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.5 20h19L12 3.5z"></path><path d="M12 10v4.5M12 17.5v.3"></path></svg></sc-if>
<sc-if value="{{p.isRun}}"><span class="spin-sm"></span></sc-if>
<sc-if value="{{p.isPend}}"><span>{{p.n}}</span></sc-if>
</span>
<span style="display: flex; flex-direction: column; min-width: 0; gap: 1px">
<span class="plabel">{{p.name}}</span>
<span class="plabel" style="font-size: 11.5px; font-weight: 600; opacity: 0.85">{{p.stateLabel}}</span>
</span>
</span>
</span>
</sc-for>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<sc-if value="{{lv.isBook}}">
<div class="card" style="overflow: hidden">
<div style="padding: 14px 20px; background: #0E1A3A; color: #ffffff; display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<span class="tag" style="background: rgba(255,255,255,0.16); color: #ffffff">Step 1 · Client’s view</span>
<span style="font-size: 14px; font-weight: 600">The booking page your client opens from your scheduling link</span>
</div>
<div style="padding: 24px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 14px">
<span class="av" style="width: 48px; height: 48px; background: #1D5BFF">AM</span>
<div>
<p style="margin: 0; font-weight: 800; font-size: 19px">Book time with Alex Morgan</p>
<p style="margin: 2px 0 0; font-size: 14px; color: #4A5675">45 min · video call · Alex Morgan Wealth</p>
</div>
</div>
<fieldset class="fs">
<legend class="lbl">Who is booking?</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{lv.clientChips}}" as="c" hint-placeholder-count="7">
<button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button>
</sc-for>
</div>
</fieldset>
<sc-if value="{{lv.isNewClient}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<div><label class="lbl" for="nc-name">Full name</label><input id="nc-name" class="fld" type="text" placeholder="e.g. Chris Patel" value="{{lv.name}}" onChange="{{lv.onName}}"></div>
<div><label class="lbl" for="nc-email">Email</label><input id="nc-email" class="fld" type="email" placeholder="name@example.com" value="{{lv.email}}" onChange="{{lv.onEmail}}"></div>
<div><label class="lbl" for="nc-phone">Mobile (for text reminders)</label><input id="nc-phone" class="fld" type="tel" placeholder="(555) 555-0100" value="{{lv.phone}}" onChange="{{lv.onPhone}}"></div>
</div>
</sc-if>
<sc-if value="{{lv.isExisting}}">
<p style="margin: 0; font-size: 13.5px; color: #4A5675">Booking as {{lv.bookerName}} · {{lv.bookerEmail}}</p>
</sc-if>
<fieldset class="fs">
<legend class="lbl">Meeting type</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{lv.typeChips}}" as="c" hint-placeholder-count="4">
<button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button>
</sc-for>
</div>
</fieldset>
<div style="display: flex; flex-wrap: wrap; gap: 22px">
<fieldset class="fs">
<legend class="lbl">Day</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{lv.dayChips}}" as="c" hint-placeholder-count="3">
<button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button>
</sc-for>
</div>
</fieldset>
<fieldset class="fs">
<legend class="lbl">Time</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{lv.timeChips}}" as="c" hint-placeholder-count="4">
<button class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}">{{c.label}}</button>
</sc-for>
</div>
</fieldset>
</div>
<sc-if value="{{lv.hasErr}}"><p role="alert" style="margin: 0; color: #B42318; font-size: 14px; font-weight: 600">{{lv.err}}</p></sc-if>
<div><button class="btn btn-pri" onClick="{{lv.book}}">Confirm booking</button></div>
</div>
</div>
</sc-if>

<sc-if value="{{lv.isRunning}}">
<div class="card" style="padding: 28px; display: flex; align-items: center; gap: 18px">
<span class="spin" aria-hidden="true"></span>
<div role="status" style="min-width: 0">
<p style="margin: 0; font-weight: 800; font-size: 17px">{{lv.runTitle}}</p>
<p style="margin: 4px 0 0; font-size: 14.5px; color: #4A5675">{{lv.runText}}</p>
</div>
</div>
</sc-if>

<sc-if value="{{lv.isWaiting}}">
<div class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 19px; font-weight: 800">{{lv.bookerName}} is booked for {{lv.when}}</p>
<p style="margin: 0; font-size: 14.5px; color: #4A5675; line-height: 1.55">The invite and reminders are out and the CRM is up to date. In real life FinProIQ waits here until the meeting ends, then asks for your notes. For this demo, skip ahead.</p>
<div><button class="btn btn-pri" onClick="{{lv.fastForward}}">Skip ahead: the meeting just ended</button></div>
</div>
</sc-if>

<sc-if value="{{lv.hasNotes}}">
<div class="action">
<div>
<p style="margin: 0; font-weight: 800; font-size: 16.5px">Notes from your meeting with {{lv.bookerFirst}}</p>
<p style="margin: 4px 0 0; font-size: 13.5px; color: #4A5675; line-height: 1.5">{{lv.np.detail}}</p>
</div>
<div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap">
<button class="{{lv.np.micCls}}" onClick="{{lv.np.toggleMic}}" aria-label="{{lv.np.micAria}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"></path></svg></button>
<span style="font-size: 14px; font-weight: 600; color: #1E2A4A; flex: 1 1 240px">{{lv.np.micText}}</span>
<button class="btn" onClick="{{lv.np.pasteNotes}}">Paste AI notetaker notes</button>
</div>
<div><label class="lbl" for="notes-live">Notes: type, paste, or dictate</label><textarea id="notes-live" class="fld" style="min-height: 160px" placeholder="e.g. Reviewed the portfolio. Action: send rebalance proposal by Friday." value="{{lv.np.notes}}" onChange="{{lv.np.onNotes}}"></textarea></div>

      np: (ph === 'notes' && w2) ? this.npVM(lm, w2) : {}, cp: (ph === 'compose' && w2 && lm.draft) ? this.composeVM(lm) : {},
      doneText: ph === 'done' ? (L.via + '. Notes and action items were saved to the CRM. Start to finish: ' + Math.floor(secs / 60) + 'm ' + (secs % 60) + 's.') : '',
      viewTimeline: lm ? openClient(lm.ck, lm.id) : function () {}, again: function () { self.startLive(); },
      log: L.log.map(function (l) { return { step: 'Step ' + (l.step + 1), t: l.t, x: l.x }; }), noLog: L.log.length === 0
    };

    return {
      isLive: view === 'live', lv: lv,
      startLive: function () { self.startLive(); }, startLiveFor: function () { self.startLive(ck); },
      isDash: view === 'dash', isClients: view === 'client',
      navDashCls: 'nav' + (view === 'dash' ? ' nav-on' : ''), navCliCls: 'nav' + (view === 'client' ? ' nav-on' : ''),
      goDash: function () { self.setState({ view: 'dash' }); }, goClients: function () { self.setState({ view: 'client' }); },
      greet: greet, todayStr: todayStr, greetSub: greetSub, kpis: kpis,
      actChips: actChips, acts: acts, noActs: acts.length === 0,
      hasActClient: !!ac, actClientName: ac ? d.byKey[ac].name : '', clearActClient: function () { self.setState({ actClient: null }); },
      attn: attn, attnCount: String(attn.length), hasAttn: attn.length > 0, noAttn: attn.length === 0, upcoming: upcoming,
      search: s.search || '', onSearch: function (e) { self.setState({ search: e.target.value }); },
      clientList: clientList, noClients: clientList.length === 0, client: client,
      meetChips: meetChips, meetings: meetings, noMeetings: meetings.length === 0,
      toast: s.toast || '', hasToast: !!s.toast
    };
  }
}
</script>
